services:
  devops:
    build: .
    image: devops:latest
    container_name: devops-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Xms64m -Xmx384m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iwvgdevopsdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    networks:
      - devopsNet

networks:
  devopsNet:
    external: true

#> docker compose up --build -d
#> docker network create devops